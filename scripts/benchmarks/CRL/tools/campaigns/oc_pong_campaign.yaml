# =============================================================================
# Campaign manifest for tools/run_campaign.py
# =============================================================================
#   python tools/run_campaign.py tools/campaigns/final_eval.yaml --dry-run
#   python tools/run_campaign.py tools/campaigns/final_eval.yaml
#
# Every run below is one ppo_crl_continual.py process:
#   sequences x methods x modalities x seeds
# Jobs are queued and each GPU runs one at a time (NUM_ENVS=8192 fills a GPU).
# Finished runs (runs/<name>/matrix.json exists) are skipped, so relaunching after
# an interruption resumes where it left off. --force re-runs them anyway.
# =============================================================================

# run via: uv run tools/run_campaign.py tools/campaigns/oc_pong_campaign.yaml

gpus: [0, 1, 2, 3, 4, 5, 6, 7]
seeds: [1, 2, 3]

sequences:
  - pong_dyn4
  - pong_vis4
  - pong_rew4

methods: [ft, ewc, agem, packnet]
modalities: [oc]

# Hydra overrides applied to every run (same syntax as the command line).
overrides:
  CRL_CURVE: true
  PROJECT: "Thesis-Experiments-OC"

# This campaign will resolve to 4 * 3 * 3 = 36 runs