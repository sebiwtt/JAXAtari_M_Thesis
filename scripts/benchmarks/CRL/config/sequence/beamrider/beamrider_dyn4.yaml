# @package _global_
# Ordered single-mod tasks; index 0 must be the base task (no mods). Mod keys are
# from src/jaxatari/games/mods/beamrider_mods.py. At most one mod per task.
ENV_ID: beamrider
SEQUENCE: dyn4
TASK_MODS:
  - []
  - ["faster_player"]     # player ship speed x2 (2.5 -> 5.0)
  - ["slower_player"]     # player ship speed x0.5
  - ["aggressive_ufos"]   # UFOs attack far sooner and more often (active from sector 1)
  - ["fast_enemy_shots"]  # UFO shot speed x2 (UFO movement unchanged)

